<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <h1>Student Task Manager</h1>

        <button id="themeBtn" type="button">
            Dark Mode
        </button>

    </header>


    <!-- Main Container -->
    <main class="container">


        <!-- Add Task Section -->
        <section class="task-form-section">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <div class="form-group">

                    <label for="taskInput">
                        Task Name
                    </label>

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter your task"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <select id="priority">

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                    </select>

                </div>


                <button type="submit" class="add-btn">
                    Add Task
                </button>

            </form>

        </section>



        <!-- Task Information -->
        <section class="Task-info">

            <div class="stat-card">

                <h3 id="totalTasks">
                    0
                </h3>

                <p>Total Tasks</p>

            </div>


            <div class="stat-card">

                <h3 id="completedTasks">
                    0
                </h3>

                <p>Completed</p>

            </div>


            <div class="stat-card">

                <h3 id="pendingTasks">
                    0
                </h3>

                <p>Pending</p>

            </div>

        </section>



        <!-- Search and Filter -->
        <section class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search task..."
            >


            <select id="filterSelect">

                <option value="all">
                    All Tasks
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>

        </section>



        <!-- Task List -->
        <section class="task-section">

            <h2>My Tasks</h2>

            <div id="taskList">
                <!-- JavaScript will add tasks here -->
            </div>


            <p id="emptyMessage">
                No Tasks available.
            </p>

        </section>

    </main>



    <!-- Footer -->
    <footer>

        <p>
            @2026 Student Task Manager
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
